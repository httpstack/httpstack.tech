<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTpsTACK</title>
    <link rel="stylesheet" href="/public/assets/enabled/css/style.css" type="text/css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=http" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
</head>

<body>
    <div class="app-frame">
        <header class="frame-header">
            <div class="header-brand">
                <span class="brand-logo">
                    <svg height="50" width="50" viewBox="0 0 24 24">
                        <defs>
                            <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#6a0572">
                                    <animate attributeName="stop-color" values="#6a0572;#e67e22;#27ae60;#6a0572"
                                        dur="6s" repeatCount="indefinite" />
                                </stop>
                                <stop offset="100%" stop-color="#e67e22">
                                    <animate attributeName="stop-color" values="#e67e22;#27ae60;#6a0572;#e67e22"
                                        dur="6s" repeatCount="indefinite" />
                                </stop>
                            </linearGradient>
                        </defs>
                        <path
                            d="M2 6a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V6zm5 1a1 1 0 0 0 0 2h5a1 1 0 1 0 0-2H7zm8 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2zm-8 4a1 1 0 1 0 0 2h1a1 1 0 1 0 0-2H7zm4 0a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-6zm-4 4a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H7zm8 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2z"
                            fill="url(#animatedGradient)" fillRule="evenodd" />
                        <!--<path
                            d="M4.5 11h-2V9.75c0-.41-.34-.75-.75-.75S1 9.34 1 9.75v4.5c0 .41.34.75.75.75s.75-.34.75-.75V12.5h2v1.75c0 .41.34.75.75.75s.75-.34.75-.75v-4.5C6 9.34 5.66 9 5.25 9s-.75.34-.75.75V11zm3.25-.5h.75v3.75c0 .41.34.75.75.75s.75-.34.75-.75V10.5h.75c.41 0 .75-.34.75-.75S11.16 9 10.75 9h-3c-.41 0-.75.34-.75.75s.34.75.75.75zm5.5 0H14v3.75c0 .41.34.75.75.75s.75-.34.75-.75V10.5h.75c.41 0 .75-.34.75-.75S16.66 9 16.25 9h-3c-.41 0-.75.34-.75.75s.34.75.75.75zM21.5 9H19c-.55 0-1 .45-1 1v4.25c0 .41.34.75.75.75s.75-.34.75-.75V13h2c.83 0 1.5-.68 1.5-1.5v-1c0-.82-.67-1.5-1.5-1.5zm0 2.5h-2v-1h2v1z"
                            fill="url(#animatedGradient)" />-->
                    </svg>
                    <!--<i class="bi bi-code animated-icon"></i>-->

                </span>
                <span class="brand-title">{{appName}}</span>
                <span class="brand-slogan"><sub>{{appSlogan}}</sub></span>
            </div>
            <div class="header-controls">
                <!-- Theme Toggle Button -->
                <button class="theme-toggle" aria-label="Toggle dark mode">
                    <i class="bi bi-sun theme-icon-sun"></i>
                    <i class="bi bi-moon theme-icon-moon"></i>
                </button>
                <!-- Hamburger Menu Button (for mobile) -->
                <button class="hamburger-menu" aria-label="Open navigation">
                    <i class="bi bi-list"></i>
                </button>
            </div>
            <nav class="header-nav nav-closed">
                <ul class="nav-list" data-repeat="links as link">
                    <li class="nav-item" data-repeat-item="link">
                        <a href="link[uri]" class="nav-link">link[label]</a>
                    </li>
                </ul>
            </nav>
        </header>

        <!-- Hero Section - This will be dynamically loaded by the controller for the homepage -->
        <!-- The content of home.html's hero section will be rendered here -->
        <section class="frame-hero">
            <div class="hero-content">
                <h1>{{heroTitle}}</h1>
                <p>{{heroDescription}}</p>
                <a href="{{heroCtaUri}}" class="hero-cta">{{heroCtaLabel}}</a>
            </div>
        </section>
        <div id="view" data-key="view"></div>


        <footer class="frame-footer">
            <div class="footer-content">
                <div class="footer-function">
                    <span class="copyright">&copy; 2025 httpStack.tech</span>
                </div>
                <div class="footer-copyright">
                    <div class="social-links">
                        <a href="https://github.com/your-username" target="_blank"><i class="bi bi-github"></i></a>
                        <a href="https://linkedin.com/in/your-username" target="_blank"><i
                                class="bi bi-linkedin"></i></a>
                        <a href="https://twitter.com/your-username" target="_blank"><i class="bi bi-twitter"></i></a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>

    </script>
</body>

</html>
